[project]
name = "ome-zarr-book"
version = "1.0"
description = "An introduction to OME-Zarr for big bioimaging data."
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "imageio[tifffile]==2.37.4",
    "matplotlib==3.11.1",
    "numcodecs==0.16.5",
    "numpy==2.5.1",
    "zarr==3.3.0",
    "rich==15.0.0",
    "pydantic-zarr==0.10.0",
    "ome-zarr-models==1.7",
    "joblib==1.5.3",
    "scipy==1.18.0",
    "scikit-image==0.25.0",
    "pooch==1.9.0",
    "jupyterlab==4.6.2",
    "jupytext==1.19.5",
]

[tool.setuptools]
packages = []

[dependency-groups]
build = [
    "jupyter-book==2.1.6",
]
dev = [
    "jupyter-ruff==0.3.1",
    "pre-commit==4.7.0",
]
