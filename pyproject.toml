[project]
name = "ome-zarr-book"
version = "1.0"
description = "An introduction to OME-Zarr for big bioimaging data."
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "imageio[tifffile]==2.38.1",
    "matplotlib==3.11.2",
    "numcodecs==0.17.1",
    "numpy==2.5.4",
    "zarr==3.4.2",
    "rich==15.0.0",
    "pydantic-zarr==0.10.0",
    "ome-zarr-models==1.8.1",
    "joblib==1.6.0",
    "scipy==1.18.1",
    "scikit-image==0.26.0",
    "pooch==1.9.0",
    "jupyterlab==4.6.5",
    "jupytext==1.19.6",
]

[tool.setuptools]
packages = []

[dependency-groups]
build = [
    "jupyter-book==2.1.7",
]
dev = [
    "jupyter-ruff==0.3.1",
    "pre-commit==4.7.0",
]
