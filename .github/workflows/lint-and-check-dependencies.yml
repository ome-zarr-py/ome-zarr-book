name: lint-and-check-dependencies

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install uv
        uses: astral-sh/setup-uv@f94ec6bedd8674c4426838e6b50417d36b6ab231 # v5.3.1
      - name: Run pre-commit
        run: uv run pre-commit run --all-files --show-diff-on-failure --color=always

  check-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@f94ec6bedd8674c4426838e6b50417d36b6ab231 # v5.3.1

      - name: Check uv.lock is up to date with pyproject.toml
        run: uv lock --check

      - name: Check requirements.txt is up to date with uv.lock
        run: |
          uv export --format requirements.txt --no-hashes --no-annotate --no-dev --locked --no-header --output-file tmp-requirements.txt
          diff -u requirements.txt tmp-requirements.txt
