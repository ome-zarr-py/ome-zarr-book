version: 1
project:
  title: An Introduction to OME-Zarr for Big Bioimaging Data
  github: ome-zarr-py/ome-zarr-book
  license:
    code: BSD-3-Clause
    content: CC-BY-4.0
  toc:
    - file: home.md
    - file: running-the-code.md
    - file: 1-storage.md
    - file: 2-creation.md
    - file: 3-processing.md
      children:
        - file: 3.1-parallel-examples.md
    - file: 4-export.md
    - file: appendices.md
  settings:
    output_matplotlib_strings: 'remove'
  error_rules:
    - rule: link-resolves
      severity: ignore
      keys:
        # For some reason this isn't resolving on ReadTheDocs
        - 'https://forum.image.sc/t/an-ome-zarr-digital-textbook/117435'
site:
  options:
    logo: images/logo.svg
    folders: true
  # Pin to v1.4.1 of the template. Main currently has an incompatible
  # MyST theme. We can remove when jupyter-book updates.
  template: "https://github.com/myst-templates/book-theme/archive/23f2df5493e23dfb1d9433c8aa64c87beb4232a3.zip"
